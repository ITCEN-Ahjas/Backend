spring.application.name=Chungbuk

spring.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.mysql.jdbc-url=${DB_URL:jdbc:mysql://localhost:3306/chungbuk_db?characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.mysql.username=${DB_USER:root}
spring.datasource.mysql.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# TourAPI ??
spring.config.import=optional:classpath:application-secret.properties

tour-api.base-url=https://apis.data.go.kr/B551011/KorService2
tour-api.mobile-os=ETC
tour-api.mobile-app=ChungbukTravel
tour-api.response-type=json

# Google Places API (New)
google-places.base-url=https://places.googleapis.com
google-places.field-mask=places.id,places.displayName,places.formattedAddress,places.location,places.primaryType,places.primaryTypeDisplayName,places.types,places.rating,places.userRatingCount,places.photos,places.googleMapsUri,nextPageToken
google-places.detail-field-mask=id,displayName,formattedAddress,location,primaryType,primaryTypeDisplayName,types,rating,userRatingCount,photos,googleMapsUri,nationalPhoneNumber,internationalPhoneNumber,websiteUri,regularOpeningHours,editorialSummary,reviews

# GoCamping API
go-camping.base-url=https://apis.data.go.kr/B551011/GoCamping

# Swagger (springdoc-openapi)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

weather.kma.base-url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0

# AI route recommendation API
ai.route.base-url=http://localhost:8000
ai.route.routes-path=/api/v1/recommend/routes
